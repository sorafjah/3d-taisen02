<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cyber Arena - 3D Battle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; }
canvas { display: block; }

#hud {
  position: fixed; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 10;
}

#hp-bars {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: calc(20px + env(safe-area-inset-top)) calc(40px + env(safe-area-inset-right)) 20px calc(40px + env(safe-area-inset-left));
}

.hp-container { width: 300px; }

.hp-label {
  font-size: 14px; color: #fff; margin-bottom: 4px; text-shadow: 0 0 8px currentColor;
  letter-spacing: 2px;
}
.hp-label.player { color: #00ccff; }
.hp-label.enemy { color: #ff3366; text-align: right; }

.hp-bar-bg {
  width: 100%; height: 20px; background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.3); position: relative;
}

.hp-bar-fill { height: 100%; transition: width 0.3s ease; }
.hp-bar-fill.player { background: linear-gradient(90deg, #0066ff, #00ccff); box-shadow: 0 0 10px #00ccff; }
.hp-bar-fill.enemy { background: linear-gradient(90deg, #ff3366, #ff0044); box-shadow: 0 0 10px #ff3366; }

.hp-text {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font-size: 12px; color: #fff; text-shadow: 0 0 4px #000;
}

#crosshair {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  pointer-events: none; z-index: 10; width: 60px; height: 60px;
}
#crosshair .h-line, #crosshair .v-line {
  position: absolute; background: rgba(0, 255, 200, 0.7);
}
#crosshair .h-line { width: 20px; height: 2px; top: 50%; transform: translateY(-50%); }
#crosshair .h-line.left { left: 0; }
#crosshair .h-line.right { right: 0; }
#crosshair .v-line { height: 20px; width: 2px; left: 50%; transform: translateX(-50%); }
#crosshair .v-line.top { top: 0; }
#crosshair .v-line.bottom { bottom: 0; }
#crosshair .dot {
  position: absolute; width: 4px; height: 4px; background: #00ffc8;
  border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%);
  box-shadow: 0 0 6px #00ffc8;
}
#crosshair .ring {
  position: absolute; width: 20px; height: 20px; border: 1px solid rgba(0,255,200,0.4);
  border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%);
}

#enemy-marker {
  position: fixed; pointer-events: none; z-index: 10;
  width: 40px; height: 40px; display: none;
}
#enemy-marker .bracket { position: absolute; border: 2px solid #ff3366; }
#enemy-marker .bracket.tl { top: 0; left: 0; width: 10px; height: 10px; border-right: none; border-bottom: none; }
#enemy-marker .bracket.tr { top: 0; right: 0; width: 10px; height: 10px; border-left: none; border-bottom: none; }
#enemy-marker .bracket.bl { bottom: 0; left: 0; width: 10px; height: 10px; border-right: none; border-top: none; }
#enemy-marker .bracket.br { bottom: 0; right: 0; width: 10px; height: 10px; border-left: none; border-top: none; }

#controls-info {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.4); font-size: 11px; z-index: 10; pointer-events: none;
  text-align: center; letter-spacing: 1px;
}

#game-over-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  display: none; justify-content: center; align-items: center; flex-direction: column;
  background: rgba(0,0,0,0.7); z-index: 100;
}
#game-over-screen.active { display: flex; }

#game-result {
  font-size: 64px; color: #fff; text-shadow: 0 0 30px currentColor;
  margin-bottom: 30px; letter-spacing: 8px;
}
#game-result.win { color: #00ccff; }
#game-result.lose { color: #ff3366; }

#retry-btn {
  padding: 15px 50px; font-size: 20px; font-family: 'Courier New', monospace;
  background: transparent; color: #00ffc8; border: 2px solid #00ffc8;
  cursor: pointer; letter-spacing: 4px; pointer-events: auto; transition: all 0.3s;
}
#retry-btn:hover { background: #00ffc8; color: #000; box-shadow: 0 0 20px #00ffc8; }

#start-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; justify-content: center; align-items: center; flex-direction: column;
  background: rgba(0,0,0,0.85); z-index: 200;
}
#start-screen h1 {
  font-size: 52px; color: #00ccff; text-shadow: 0 0 30px #00ccff;
  margin-bottom: 10px; letter-spacing: 8px;
}
#start-screen .subtitle { font-size: 16px; color: #ff3366; margin-bottom: 50px; letter-spacing: 4px; }
#start-btn {
  padding: 15px 50px; font-size: 20px; font-family: 'Courier New', monospace;
  background: transparent; color: #00ffc8; border: 2px solid #00ffc8;
  cursor: pointer; letter-spacing: 4px; transition: all 0.3s;
}
#start-btn:hover { background: #00ffc8; color: #000; box-shadow: 0 0 20px #00ffc8; }
#start-controls {
  margin-top: 40px; color: rgba(255,255,255,0.5); font-size: 13px;
  text-align: center; line-height: 2.2;
}

/* === iPad / Touch UI === */
#touch-ui { position: fixed; inset: 0; z-index: 50; pointer-events: none; display: none; }
@media (pointer: coarse) { #touch-ui { display: block; } #controls-info { display: none; } }

/* Left: analog joystick */
#touch-left{
  position:absolute;
  left: calc(18px + env(safe-area-inset-left));
  bottom: calc(18px + env(safe-area-inset-bottom));
  width: 220px; height: 220px;
  pointer-events:auto;
}
#joystick{ position:relative; width:220px; height:220px; }
#joy-base{
  position:absolute; inset:0;
  border-radius:50%;
  border:2px solid rgba(0,255,200,0.35);
  background: rgba(0,255,200,0.06);
  box-shadow: 0 0 18px rgba(0,255,200,0.08) inset;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
#joy-ring{
  position:absolute;
  left:50%; top:50%; transform:translate(-50%,-50%);
  width:120px; height:120px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.18);
}
#joy-stick{
  position:absolute;
  left:50%; top:50%; transform:translate(-50%,-50%);
  width:84px; height:84px;
  border-radius:50%;
  border:2px solid rgba(0,255,200,0.55);
  background: rgba(0,255,200,0.14);
  box-shadow: 0 0 18px rgba(0,255,200,0.25);
  touch-action:none;
}

/* Right: clustered turn + fire (close & easy) */
#touch-actions{
  position:absolute;
  right: calc(18px + env(safe-area-inset-right));
  bottom: calc(22px + env(safe-area-inset-bottom));
  display:flex;
  gap: 12px;
  pointer-events:auto;
}

.tbtn{
  border:2px solid rgba(0,255,200,0.40);
  background: rgba(0,255,200,0.10);
  color: rgba(255,255,255,0.90);
  font-family: 'Courier New', monospace;
  border-radius:16px;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}
.tbtn:active{ background: rgba(0,255,200,0.22); }

.tbtn.turn{
  width:86px; height:76px;
  font-size:38px; font-weight:800;
  line-height:1;
  text-shadow: 0 0 12px rgba(0,255,200,0.40);
}
.tbtn.fire{
  width:150px; height:76px;
  font-size:22px; font-weight:800;
  letter-spacing:3px;
}

.touch-hint{
  position:absolute;
  left:50%; transform:translateX(-50%);
  bottom: calc(255px + env(safe-area-inset-bottom));
  color: rgba(255,255,255,0.30);
  font-size:11px;
  letter-spacing:1px;
  pointer-events:none;
}

@media (max-width: 900px) {
  .hp-container { width: 220px; }
}
</style>
</head>
<body>

<div id="start-screen">
  <h1>CYBER ARENA</h1>
  <div class="subtitle">VIRTUAL COMBAT SYSTEM</div>
  <button id="start-btn">START</button>
  <div id="start-controls">
    [↑/↓] Forward &amp; Back &nbsp; [←/→] Strafe<br>
    [Z/X] Turn (slow) &nbsp; [Space or Left Click] Shoot<br>
    <span style="color:rgba(255,200,0,0.6)">Bullets have slight homing ability</span>
  </div>
</div>

<div id="hud">
  <div id="hp-bars">
    <div class="hp-container">
      <div class="hp-label player">PLAYER</div>
      <div class="hp-bar-bg">
        <div class="hp-bar-fill player" id="player-hp-bar" style="width:100%"></div>
        <span class="hp-text" id="player-hp-text">100/100</span>
      </div>
    </div>
    <div class="hp-container">
      <div class="hp-label enemy">ENEMY</div>
      <div class="hp-bar-bg">
        <div class="hp-bar-fill enemy" id="enemy-hp-bar" style="width:100%"></div>
        <span class="hp-text" id="enemy-hp-text">100/100</span>
      </div>
    </div>
  </div>
</div>

<div id="crosshair">
  <div class="h-line left"></div>
  <div class="h-line right"></div>
  <div class="v-line top"></div>
  <div class="v-line bottom"></div>
  <div class="dot"></div>
  <div class="ring"></div>
</div>

<div id="enemy-marker">
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>
</div>

<div id="controls-info">[↑/↓] FORWARD/BACK &nbsp; [←/→] STRAFE &nbsp; [Z/X] TURN &nbsp; [SPACE/CLICK] SHOOT</div>

<!-- Touch controls (iPad / mobile) -->
<div id="touch-ui" aria-hidden="true">
  <div id="touch-left">
    <div id="joystick">
      <div id="joy-base"></div>
      <div id="joy-ring"></div>
      <div id="joy-stick"></div>
    </div>
  </div>

  <div id="touch-actions">
    <button class="tbtn turn" data-hold="KeyZ" aria-label="Turn Left">⟲</button>
    <button class="tbtn fire" data-shoot="1" aria-label="Fire">FIRE</button>
    <button class="tbtn turn" data-hold="KeyX" aria-label="Turn Right">⟳</button>
  </div>

  <div class="touch-hint">Touch: Analog Move / Turn / Fire</div>
</div>

<div id="game-over-screen">
  <div id="game-result"></div>
  <button id="retry-btn">RETRY</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  'use strict';

  // === CONSTANTS ===
  const FIELD_SIZE = 100;
  const PLAYER_HP = 100;
  const ENEMY_HP = 100;
  const BULLET_DAMAGE = 20;
  const PLAYER_FIRE_INTERVAL = 0.5;
  const ENEMY_FIRE_INTERVAL = 1.5;
  const PLAYER_SPEED = 18;
  const ENEMY_SPEED = 10;
  const PLAYER_BULLET_SPEED = 80;
  const ENEMY_BULLET_SPEED = 35;
  const BULLET_LIFETIME = 3;
  const CAMERA_DISTANCE = 14;
  const CAMERA_HEIGHT = 9;
  const CAMERA_LERP = 0.08;
  const ENEMY_AIM_SPREAD = 0.18;       // radians of enemy inaccuracy
  const PLAYER_HOMING_STRENGTH = 1.5;  // gentle homing

  // ★旋回はゆっくりめ
  const PLAYER_TURN_SPEED = 2.2;       // radians/sec

  // === STATE ===
  let scene, camera, renderer;
  let player, enemy;
  let bullets = [];
  let particles = [];
  let gameState = 'start';

  let playerHP, enemyHP;
  let playerFireTimer, enemyFireTimer;
  let enemyAngle;
  let playerFlashTimer, enemyFlashTimer;
  let playerFacingAngle = 0; // player yaw

  const keys = {};
  let shootPressed = false;
  let clock;

  // Camera smoothing
  let cameraAngle = 0;

  // Touch joystick (iPad/mobile)
  let touchMoveX = 0; // -1..1 (left/right)
  let touchMoveY = 0; // -1..1 (back/forward)

  // === DOM ===
  const playerHPBar = document.getElementById('player-hp-bar');
  const playerHPText = document.getElementById('player-hp-text');
  const enemyHPBar = document.getElementById('enemy-hp-bar');
  const enemyHPText = document.getElementById('enemy-hp-text');
  const gameOverScreen = document.getElementById('game-over-screen');
  const gameResult = document.getElementById('game-result');
  const startScreen = document.getElementById('start-screen');
  const enemyMarkerEl = document.getElementById('enemy-marker');

  // === INIT ===
  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    scene.fog = new THREE.FogExp2(0x050510, 0.012);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0x222244, 0.6));
    const dirLight = new THREE.DirectionalLight(0x6666ff, 0.4);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);
    const pointLight = new THREE.PointLight(0x00ccff, 0.6, 80);
    pointLight.position.set(0, 10, 0);
    scene.add(pointLight);

    createFloor();
    createStarField();

    player = createMech(0x0066ff, 0x00ccff);
    player.position.set(0, 0.5, -20);
    scene.add(player);

    enemy = createMech(0xff0044, 0xff3366);
    enemy.position.set(0, 0.5, 20);
    scene.add(enemy);

    createBoundaryMarkers();
    resetGameState();

    clock = new THREE.Clock();
    setupEvents();
    animate();
  }

  function resetGameState() {
    playerHP = PLAYER_HP;
    enemyHP = ENEMY_HP;
    playerFireTimer = 0;
    enemyFireTimer = 0;
    enemyAngle = 0;
    playerFlashTimer = 0;
    enemyFlashTimer = 0;

    // ★開始時：敵（+Z）を正面にするため、こちらは -Z 向き（= PI）
    playerFacingAngle = Math.PI;
    cameraAngle = Math.PI;
    player.rotation.y = Math.PI;

    // Touch
    touchMoveX = 0;
    touchMoveY = 0;

    shootPressed = false;
    for (const k in keys) keys[k] = false;
    updateHPDisplay();
  }

  function createFloor() {
    scene.add(new THREE.GridHelper(FIELD_SIZE, 50, 0x0044aa, 0x002266));

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(FIELD_SIZE, FIELD_SIZE),
      new THREE.MeshBasicMaterial({ color: 0x000822, transparent: true, opacity: 0.8 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.05;
    scene.add(floor);

    const edgeGeo = new THREE.BufferGeometry();
    const h = FIELD_SIZE / 2;
    edgeGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      -h,0.1,-h, h,0.1,-h, h,0.1,-h, h,0.1,h,
      h,0.1,h, -h,0.1,h, -h,0.1,h, -h,0.1,-h
    ]), 3));
    scene.add(new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: 0x6600ff })));
  }

  function createStarField() {
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(1000 * 3);
    for (let i = 0; i < 1000; i++) {
      pos[i*3] = (Math.random()-0.5)*200;
      pos[i*3+1] = Math.random()*100+10;
      pos[i*3+2] = (Math.random()-0.5)*200;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
      color: 0xaaaaff, size: 0.3, transparent: true, opacity: 0.6
    })));
  }

  function createMech(mainColor, accentColor) {
    const g = new THREE.Group();

    const hoverMat = new THREE.MeshPhongMaterial({ color: accentColor, emissive: accentColor, emissiveIntensity: 0.4, transparent: true, opacity: 0.7 });
    const hover = new THREE.Mesh(new THREE.CylinderGeometry(0.8,1.0,0.3,8), hoverMat);
    hover.position.y = 0.5; g.add(hover);

    const legMat = new THREE.MeshPhongMaterial({ color: mainColor, emissive: mainColor, emissiveIntensity: 0.15 });
    const legs = new THREE.Mesh(new THREE.BoxGeometry(1.4,1.2,1.0), legMat);
    legs.position.y = 1.3; g.add(legs);

    const bodyMat = new THREE.MeshPhongMaterial({ color: mainColor, emissive: mainColor, emissiveIntensity: 0.2 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.8,1.6,1.2), bodyMat);
    body.position.y = 2.6; g.add(body);

    const chestMat = new THREE.MeshPhongMaterial({ color: accentColor, emissive: accentColor, emissiveIntensity: 0.5 });
    const chest = new THREE.Mesh(new THREE.BoxGeometry(1.0,0.4,1.25), chestMat);
    chest.position.y = 2.6; g.add(chest);

    const headMat = new THREE.MeshPhongMaterial({ color: mainColor, emissive: mainColor, emissiveIntensity: 0.15 });
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.6,0.8), headMat);
    head.position.y = 3.7; g.add(head);

    const visorMat = new THREE.MeshPhongMaterial({ color: accentColor, emissive: accentColor, emissiveIntensity: 0.8 });
    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.2,0.85), visorMat);
    visor.position.y = 3.7; g.add(visor);

    const armMat = new THREE.MeshPhongMaterial({ color: mainColor, emissive: mainColor, emissiveIntensity: 0.15 });
    const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.5,1.2,0.5), armMat);
    lArm.position.set(-1.4,2.6,0); g.add(lArm);
    const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.5,1.2,0.5), armMat);
    rArm.position.set(1.4,2.6,0); g.add(rArm);

    const cannonMat = new THREE.MeshPhongMaterial({ color: accentColor, emissive: accentColor, emissiveIntensity: 0.3 });
    const lCannon = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,1.0,8), cannonMat);
    lCannon.rotation.x = Math.PI/2; lCannon.position.set(-1.4,2.4,-0.7); g.add(lCannon);
    const rCannon = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,1.0,8), cannonMat);
    rCannon.rotation.x = Math.PI/2; rCannon.position.set(1.4,2.4,-0.7); g.add(rCannon);

    const sMat = new THREE.MeshPhongMaterial({ color: accentColor, emissive: accentColor, emissiveIntensity: 0.3 });
    const ls = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.4,0.8), sMat);
    ls.position.set(-1.4,3.3,0); g.add(ls);
    const rs = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.4,0.8), sMat);
    rs.position.set(1.4,3.3,0); g.add(rs);

    g.userData.bodyMaterials = [legMat, bodyMat, headMat, armMat];
    g.userData.originalColor = mainColor;
    g.userData.accentColor = accentColor;
    g.position.y = 0.5;
    return g;
  }

  function createBoundaryMarkers() {
    const h = FIELD_SIZE / 2;
    for (let x = -1; x <= 1; x += 2) {
      for (let z = -1; z <= 1; z += 2) {
        const m = new THREE.MeshPhongMaterial({ color: 0x6600ff, emissive: 0x6600ff, emissiveIntensity: 0.5, transparent: true, opacity: 0.6 });
        const p = new THREE.Mesh(new THREE.BoxGeometry(0.3,6,0.3), m);
        p.position.set(x*h, 3, z*h);
        scene.add(p);
      }
    }
  }

  // === EFFECTS ===
  function createBullet(origin, direction, isPlayer) {
    const color = isPlayer ? 0x00ffcc : 0xff4466;
    const bullet = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 8, 8),
      new THREE.MeshBasicMaterial({ color })
    );
    bullet.add(new THREE.Mesh(
      new THREE.SphereGeometry(0.35, 8, 8),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3 })
    ));
    bullet.add(new THREE.PointLight(color, 0.5, 8));

    bullet.position.copy(origin);
    const speed = isPlayer ? PLAYER_BULLET_SPEED : ENEMY_BULLET_SPEED;
    bullet.userData = {
      velocity: direction.clone().multiplyScalar(speed),
      isPlayer,
      life: BULLET_LIFETIME,
      homing: isPlayer ? PLAYER_HOMING_STRENGTH : 0
    };

    scene.add(bullet);
    bullets.push(bullet);
    createMuzzleFlash(origin, color);
  }

  function createMuzzleFlash(pos, color) {
    const f = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 8, 8),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8 })
    );
    f.position.copy(pos);
    f.userData = { life: 0.1, type: 'flash' };
    scene.add(f); particles.push(f);
  }

  function createHitEffect(pos, color) {
    for (let i = 0; i < 10; i++) {
      const p = new THREE.Mesh(
        new THREE.BoxGeometry(0.15,0.15,0.15),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1.0 })
      );
      p.position.copy(pos);
      const d = new THREE.Vector3((Math.random()-0.5)*2, Math.random()*2, (Math.random()-0.5)*2)
        .normalize().multiplyScalar(8 + Math.random()*8);
      p.userData = { velocity: d, life: 0.5, type: 'particle' };
      scene.add(p); particles.push(p);
    }
    const f = new THREE.Mesh(
      new THREE.SphereGeometry(1.0, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 })
    );
    f.position.copy(pos);
    f.userData = { life: 0.15, type: 'flash' };
    scene.add(f); particles.push(f);
  }

  function createExplosion(pos) {
    const colors = [0xff4400, 0xff8800, 0xffcc00, 0xff0044, 0xffffff];
    for (let i = 0; i < 35; i++) {
      const s = 0.1 + Math.random()*0.3;
      const p = new THREE.Mesh(
        new THREE.BoxGeometry(s,s,s),
        new THREE.MeshBasicMaterial({ color: colors[Math.floor(Math.random()*colors.length)], transparent: true, opacity: 1.0 })
      );
      p.position.copy(pos);
      const d = new THREE.Vector3((Math.random()-0.5)*2, Math.random()*2, (Math.random()-0.5)*2)
        .normalize().multiplyScalar(5 + Math.random()*15);
      p.userData = { velocity: d, life: 0.8 + Math.random()*0.5, type: 'particle' };
      scene.add(p); particles.push(p);
    }
    const f = new THREE.Mesh(
      new THREE.SphereGeometry(3, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xff8800, transparent: true, opacity: 1.0 })
    );
    f.position.copy(pos);
    f.userData = { life: 0.4, type: 'flash' };
    scene.add(f); particles.push(f);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.1, 0.5, 32),
      new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.8, side: THREE.DoubleSide })
    );
    ring.position.copy(pos);
    ring.rotation.x = -Math.PI/2;
    ring.userData = { life: 0.6, type: 'shockwave', scale: 1 };
    scene.add(ring); particles.push(ring);
  }

  // === EVENTS ===
  function setupEvents() {
    // iOS/iPad: stop page scroll / gesture zoom while playing
    document.addEventListener('touchmove', (e) => { if (gameState === 'playing') e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', (e) => e.preventDefault());

    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space') { e.preventDefault(); shootPressed = true; }
    });
    document.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'Space') shootPressed = false;
    });
    document.addEventListener('mousedown', (e) => {
      if (e.button === 0 && gameState === 'playing') shootPressed = true;
    });
    document.addEventListener('mouseup', (e) => {
      if (e.button === 0) shootPressed = false;
    });

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('retry-btn').addEventListener('click', retryGame);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Touch buttons + joystick
    const touchUI = document.getElementById('touch-ui');
    if (touchUI) {
      const onPress = (el, down) => {
        const hold = el.getAttribute('data-hold');
        if (hold) keys[hold] = down;
        const shoot = el.getAttribute('data-shoot');
        if (shoot) shootPressed = down;
      };

      const bindBtn = (btn) => {
        const down = (e) => {
          if (gameState !== 'playing') return;
          e.preventDefault();
          onPress(btn, true);
        };
        const up = (e) => {
          e.preventDefault();
          onPress(btn, false);
        };
        btn.addEventListener('pointerdown', down);
        btn.addEventListener('pointerup', up);
        btn.addEventListener('pointercancel', up);
        btn.addEventListener('pointerleave', up);
      };
      touchUI.querySelectorAll('.tbtn').forEach(bindBtn);

      // Analog joystick
      const joy = document.getElementById('joystick');
      const stick = document.getElementById('joy-stick');
      if (joy && stick) {
        let active = false;
        let centerX = 0, centerY = 0;
        const maxR = 62; // pixels

        const setStick = (dx, dy) => {
          const r = Math.hypot(dx, dy);
          const cl = r > maxR ? (maxR / r) : 1;
          const x = dx * cl;
          const y = dy * cl;

          stick.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;

          // Normalize: up (negative y) => forward (+1)
          touchMoveX = x / maxR;
          touchMoveY = (-y) / maxR;

          // deadzone
          const dz = 0.12;
          if (Math.abs(touchMoveX) < dz) touchMoveX = 0;
          if (Math.abs(touchMoveY) < dz) touchMoveY = 0;
        };

        const resetStick = () => {
          stick.style.transform = `translate(-50%, -50%)`;
          touchMoveX = 0;
          touchMoveY = 0;
        };

        const updateCenter = () => {
          const rect = joy.getBoundingClientRect();
          centerX = rect.left + rect.width / 2;
          centerY = rect.top + rect.height / 2;
        };

        const down = (e) => {
          if (gameState !== 'playing') return;
          e.preventDefault();
          active = true;
          updateCenter();
          joy.setPointerCapture(e.pointerId);
          setStick(e.clientX - centerX, e.clientY - centerY);
        };

        const move = (e) => {
          if (!active) return;
          e.preventDefault();
          setStick(e.clientX - centerX, e.clientY - centerY);
        };

        const up = (e) => {
          if (!active) return;
          e.preventDefault();
          active = false;
          resetStick();
          try { joy.releasePointerCapture(e.pointerId); } catch (_) {}
        };

        joy.addEventListener('pointerdown', down);
        joy.addEventListener('pointermove', move);
        joy.addEventListener('pointerup', up);
        joy.addEventListener('pointercancel', up);
      }
    }
  }

  function startGame() {
    startScreen.style.display = 'none';
    gameState = 'playing';
  }

  function retryGame() {
    resetGameState();
    player.position.set(0, 0.5, -20);

    // ★敵が前になる向き
    playerFacingAngle = Math.PI;
    cameraAngle = Math.PI;
    player.rotation.y = Math.PI;

    enemy.position.set(0, 0.5, 20);
    enemy.rotation.y = 0;
    enemy.visible = true;
    resetMechColor(player);
    resetMechColor(enemy);
    for (const b of bullets) scene.remove(b);
    bullets = [];
    for (const p of particles) scene.remove(p);
    particles = [];
    updateHPDisplay();
    gameOverScreen.classList.remove('active');
    gameState = 'playing';
  }

  function resetMechColor(mech) {
    for (const m of mech.userData.bodyMaterials) {
      m.color.setHex(mech.userData.originalColor);
      m.emissive.setHex(mech.userData.originalColor);
      m.emissiveIntensity = 0.15;
    }
  }

  // === Angle utils ===
  function lerpAngle(a, b, t) {
    let diff = b - a;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    return a + diff * t;
  }

  // === UPDATE ===
  function updatePlayer(dt) {
    // ★移動は「自分の向き」基準。↓でバックしても視点は回らない
    const forward = new THREE.Vector3(-Math.sin(playerFacingAngle), 0, -Math.cos(playerFacingAngle));
    const right = new THREE.Vector3(-forward.z, 0, forward.x);

    // ★旋回（ゆっくり）：Z/X のみ
    let turnInput = 0;
    if (keys['KeyZ']) turnInput += 1;
    if (keys['KeyX']) turnInput -= 1;
    if (turnInput !== 0) {
      playerFacingAngle += turnInput * PLAYER_TURN_SPEED * dt;
    }

    // ★移動：矢印 + ジョイスティック（iPad）
    const moveDir = new THREE.Vector3();

    // Keyboard
    if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(forward);
    if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(forward);
    if (keys['ArrowRight'] || keys['KeyE']) moveDir.add(right);
    if (keys['ArrowLeft']  || keys['KeyQ']) moveDir.sub(right);

    // Touch joystick (smooth)
    if (Math.abs(touchMoveX) > 0.01 || Math.abs(touchMoveY) > 0.01) {
      moveDir.add(right.clone().multiplyScalar(touchMoveX));
      moveDir.add(forward.clone().multiplyScalar(touchMoveY));
    }

    if (moveDir.length() > 0.01) {
      // 入力の強さで速度が変わる（アナログっぽい）
      const mag = Math.min(1, moveDir.length());
      moveDir.normalize();
      player.position.add(moveDir.multiplyScalar(PLAYER_SPEED * mag * dt));
    }

    // Apply facing rotation
    player.rotation.y = playerFacingAngle;

    // Clamp to field
    const half = FIELD_SIZE / 2 - 1;
    player.position.x = Math.max(-half, Math.min(half, player.position.x));
    player.position.z = Math.max(-half, Math.min(half, player.position.z));

    // Hover bob
    player.position.y = 0.5 + Math.sin(Date.now() * 0.003) * 0.15;

    // Shooting: fires in the direction the player is facing
    playerFireTimer -= dt;
    if (shootPressed && playerFireTimer <= 0) {
      playerFireTimer = PLAYER_FIRE_INTERVAL;
      const shootDir = new THREE.Vector3(-Math.sin(playerFacingAngle), 0, -Math.cos(playerFacingAngle));
      const bulletStart = player.position.clone().add(shootDir.clone().multiplyScalar(1.5));
      bulletStart.y = player.position.y + 2.0;
      createBullet(bulletStart, shootDir, true);
    }

    // Flash effect
    updateFlashEffect(dt, player, 'player');
  }

  function updateFlashEffect(dt, mech, who) {
    let timer = who === 'player' ? playerFlashTimer : enemyFlashTimer;
    if (timer > 0) {
      timer -= dt;
      if (who === 'player') playerFlashTimer = timer; else enemyFlashTimer = timer;
      const flash = Math.sin(timer * 40) > 0;
      for (const m of mech.userData.bodyMaterials) {
        if (flash) {
          m.emissive.setHex(who === 'player' ? 0xff0000 : 0xffffff);
          m.emissiveIntensity = 1.0;
        } else {
          m.emissive.setHex(mech.userData.originalColor);
          m.emissiveIntensity = 0.15;
        }
      }
      if (timer <= 0) {
        for (const m of mech.userData.bodyMaterials) {
          m.emissive.setHex(mech.userData.originalColor);
          m.emissiveIntensity = 0.15;
        }
      }
    }
  }

  function updateEnemy(dt) {
    if (enemyHP <= 0) return;

    const toPlayer = new THREE.Vector3().subVectors(player.position, enemy.position);
    toPlayer.y = 0;
    enemy.rotation.y = Math.atan2(-toPlayer.x, -toPlayer.z);

    // Circle strafe
    enemyAngle += dt * 0.6;
    const dist = toPlayer.length();
    const desiredDist = 18;

    const circleDir = new THREE.Vector3(Math.cos(enemyAngle), 0, Math.sin(enemyAngle)).normalize();
    const moveDir = new THREE.Vector3();
    if (dist < desiredDist - 3) moveDir.sub(toPlayer.clone().normalize());
    else if (dist > desiredDist + 3) moveDir.add(toPlayer.clone().normalize());
    moveDir.add(circleDir.multiplyScalar(0.7));

    if (moveDir.length() > 0) {
      moveDir.normalize().multiplyScalar(ENEMY_SPEED * dt);
      enemy.position.add(moveDir);
    }

    const half = FIELD_SIZE / 2 - 1;
    enemy.position.x = Math.max(-half, Math.min(half, enemy.position.x));
    enemy.position.z = Math.max(-half, Math.min(half, enemy.position.z));
    enemy.position.y = 0.5 + Math.sin(Date.now() * 0.003 + 1) * 0.15;

    // Shooting with spread
    enemyFireTimer -= dt;
    if (enemyFireTimer <= 0) {
      enemyFireTimer = ENEMY_FIRE_INTERVAL;
      const aimDir = toPlayer.clone().normalize();
      // Random spread
      const spread = (Math.random() - 0.5) * 2 * ENEMY_AIM_SPREAD;
      const c = Math.cos(spread), s = Math.sin(spread);
      const ax = aimDir.x, az = aimDir.z;
      aimDir.x = ax * c - az * s;
      aimDir.z = ax * s + az * c;
      const start = enemy.position.clone().add(aimDir.clone().multiplyScalar(1.5));
      start.y = enemy.position.y + 2.0;
      createBullet(start, aimDir, false);
    }

    updateFlashEffect(dt, enemy, 'enemy');
  }

  function updateBullets(dt) {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];

      // Gentle homing for player bullets
      if (b.userData.isPlayer && b.userData.homing > 0 && enemyHP > 0) {
        const toTarget = new THREE.Vector3().subVectors(
          enemy.position.clone().add(new THREE.Vector3(0, 2, 0)),
          b.position
        ).normalize();
        const curDir = b.userData.velocity.clone().normalize();
        curDir.lerp(toTarget, b.userData.homing * dt);
        curDir.normalize();
        b.userData.velocity.copy(curDir.multiplyScalar(PLAYER_BULLET_SPEED));
      }

      b.position.add(b.userData.velocity.clone().multiplyScalar(dt));
      b.userData.life -= dt;

      // Hit enemy
      if (b.userData.isPlayer && enemyHP > 0) {
        if (b.position.distanceTo(enemy.position.clone().add(new THREE.Vector3(0,2,0))) < 2.2) {
          enemyHP = Math.max(0, enemyHP - BULLET_DAMAGE);
          updateHPDisplay();
          createHitEffect(b.position.clone(), 0xff4466);
          enemyFlashTimer = 0.3;
          scene.remove(b); bullets.splice(i, 1);
          if (enemyHP <= 0) {
            createExplosion(enemy.position.clone().add(new THREE.Vector3(0,2,0)));
            enemy.visible = false;
            endGame(true);
          }
          continue;
        }
      }

      // Hit player
      if (!b.userData.isPlayer) {
        if (b.position.distanceTo(player.position.clone().add(new THREE.Vector3(0,2,0))) < 1.8) {
          playerHP = Math.max(0, playerHP - BULLET_DAMAGE);
          updateHPDisplay();
          createHitEffect(b.position.clone(), 0x00ccff);
          playerFlashTimer = 0.3;
          scene.remove(b); bullets.splice(i, 1);
          if (playerHP <= 0) {
            createExplosion(player.position.clone().add(new THREE.Vector3(0,2,0)));
            endGame(false);
          }
          continue;
        }
      }

      // Out of bounds / lifetime
      const bh = FIELD_SIZE / 2 + 5;
      if (b.userData.life <= 0 || Math.abs(b.position.x) > bh || Math.abs(b.position.z) > bh) {
        scene.remove(b); bullets.splice(i, 1);
      }
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.userData.life -= dt;
      if (p.userData.type === 'particle') {
        p.position.add(p.userData.velocity.clone().multiplyScalar(dt));
        p.userData.velocity.y -= 15 * dt;
        p.material.opacity = Math.max(0, p.userData.life / 0.8);
        p.scale.multiplyScalar(0.97);
      } else if (p.userData.type === 'flash') {
        p.material.opacity = Math.max(0, p.userData.life * 6);
        p.scale.multiplyScalar(1.05);
      } else if (p.userData.type === 'shockwave') {
        p.userData.scale += dt * 30;
        p.scale.set(p.userData.scale, p.userData.scale, 1);
        p.material.opacity = Math.max(0, p.userData.life / 0.6);
      }
      if (p.userData.life <= 0) {
        scene.remove(p); particles.splice(i, 1);
      }
    }
  }

  function updateCamera(dt) {
    // ★カメラは常に「自分の後ろ」から（向きに追従）
    cameraAngle = lerpAngle(cameraAngle, playerFacingAngle, CAMERA_LERP);

    const behindX = Math.sin(cameraAngle) * CAMERA_DISTANCE;
    const behindZ = Math.cos(cameraAngle) * CAMERA_DISTANCE;

    const targetPos = new THREE.Vector3(
      player.position.x + behindX,
      CAMERA_HEIGHT,
      player.position.z + behindZ
    );
    camera.position.lerp(targetPos, 0.10);

    // Look slightly ahead of player
    const lookTarget = player.position.clone();
    lookTarget.y += 2.5;
    const fwd = new THREE.Vector3(-Math.sin(playerFacingAngle), 0, -Math.cos(playerFacingAngle));
    lookTarget.add(fwd.multiplyScalar(5));
    camera.lookAt(lookTarget);
  }

  function updateEnemyMarker() {
    if (enemyHP <= 0 || !enemy.visible) {
      enemyMarkerEl.style.display = 'none';
      return;
    }
    const ePos = enemy.position.clone();
    ePos.y += 2.5;
    const projected = ePos.project(camera);
    const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-projected.y * 0.5 + 0.5) * window.innerHeight;
    if (projected.z < 1 && x > -50 && x < window.innerWidth + 50 && y > -50 && y < window.innerHeight + 50) {
      enemyMarkerEl.style.display = 'block';
      enemyMarkerEl.style.left = (x - 20) + 'px';
      enemyMarkerEl.style.top = (y - 20) + 'px';
    } else {
      enemyMarkerEl.style.display = 'none';
    }
  }

  function updateHPDisplay() {
    playerHPBar.style.width = (playerHP / PLAYER_HP * 100) + '%';
    enemyHPBar.style.width = (enemyHP / ENEMY_HP * 100) + '%';
    playerHPText.textContent = playerHP + '/' + PLAYER_HP;
    enemyHPText.textContent = enemyHP + '/' + ENEMY_HP;
  }

  function endGame(won) {
    gameState = 'over';
    setTimeout(() => {
      gameResult.textContent = won ? 'YOU WIN!' : 'GAME OVER';
      gameResult.className = won ? 'win' : 'lose';
      gameOverScreen.classList.add('active');
    }, won ? 800 : 500);
  }

  // === MAIN LOOP ===
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    if (gameState === 'playing') {
      updatePlayer(dt);
      updateEnemy(dt);
      updateBullets(dt);
      updateCamera(dt);
      updateEnemyMarker();
    }

    updateParticles(dt);
    renderer.render(scene, camera);
  }

  init();
})();
</script>
</body>
</html>
